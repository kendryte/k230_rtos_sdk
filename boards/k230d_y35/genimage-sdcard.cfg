image bin.vfat {
	vfat {
		label = "BIN"
	}
	size = 20M
	temporary = true
	mountpoint = "bin"
}

image app.vfat {
	vfat {
		label = "SDCARD"
		extraargs = " -F 16 -s 64 "
	}
	size = 500M
	temporary = true
	mountpoint = "sdcard"
}

image sysimage-sdcard.img {
	hdimage {
		# Enable TOC (Table of Contents)
		toc = true
		toc-offset = 0xe0000

		# use mbr
		partition-table-type = "mbr"
	}

	partition ota_meta {
		in-partition-table = false
		offset = 0xf0000
		size = 0x800
	}

	partition spl {
		in-partition-table = false
		offset = 0x100000
		image = "uboot/fn_u-boot-spl.bin"
	}

	partition uboot_env {
		in-partition-table = false
		offset = 0x1e0000
		size = 0x10000
		image = "uboot/env.bin"
	}

	partition uboot {
		in-partition-table = false
		offset = 0x200000
		image = "uboot/fn_ug_u-boot.bin"
	}

	partition rtt_a {
		in-partition-table = false
		offset = 10M
		size = 20M
		image = "opensbi/opensbi_rtt_system.bin"
		load = true
		boot = 0x3
	}

	partition rtapp_a {
		in-partition-table = false
		offset = 30M
		size = 30M
		image = "rtapp/rtapp.elf.gz"
		load = true
	}

	partition rtt_b {
		in-partition-table = false
		offset = 60M
		size = 20M
		image = "opensbi/opensbi_rtt_system.bin"
		load = true
		boot = 0x3
	}

	partition rtapp_b {
		in-partition-table = false
		offset = 80M
		size = 30M
		image = "rtapp/rtapp.elf.gz"
		load = true
	}

	partition bin {
		partition-type = 0xc
		offset = 110M
		image = "bin.vfat"
	}

	partition app {
		partition-type = 0xc
		image = "app.vfat"
	}
}
