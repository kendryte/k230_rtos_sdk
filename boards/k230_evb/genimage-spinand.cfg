# 128 MiB NAND, 128 KiB erase blocks. Kernel and app each have one slot.
# Physical layout (MiB): boot/metadata 0-1, rtt 1-10, rtapp 10-40,
# bin 40-60, sdcard 60-120, unallocated 120-128.
# Keep filesystem offsets and sizes in sync with spinand_parts.h.
# Factory UFFS images are smaller so the writer can skip bad blocks in place.
flash spinand-128m {
	uffs = true
	page-size = 2048
	block-pages = 64
	total-blocks = 1024
	spare-size = 64
	status-offset = 0
}

image bin.uffs {
	uffs {
		size = 10M
	}
	size = 20M
	mountpoint = "bin"
	flashtype = "spinand-128m"
}

image sdcard.uffs {
	uffs {
		size = 50M
	}
	size = 60M
	mountpoint = "sdcard"
	flashtype = "spinand-128m"
}

image sysimage-spinand.kdimg {
	size = 128M
	flashtype = "spinand-128m"
	kdimage {
		image_info = "v1.1.0"
		chip_info = "K230"
		board_info = "K230_evb_spi_nand"
		medium-type = "spi_nand"
		toc = true
		toc-offset = 0xe0000
	}

	# Primary and backup SPL copies, with room to skip bad blocks.
	partition spl_a {
		in-partition-table = false
		offset = 0
		size = 512K
		image = "uboot/swap_fn_u-boot-spl.bin"
	}

	# Keep the erase block at 0xe0000 for the fixed TOC and metadata.
	partition spl_b {
		in-partition-table = false
		offset = 512K
		size = 384K
		image = "uboot/swap_fn_u-boot-spl.bin"
	}

	# Reserved TOC entry only; shares the TOC erase block, not for NAND OTA.
	partition ota_meta {
		in-partition-table = false
		offset = 0xf0000
		size = 0x800
	}

	partition rtt {
		in-partition-table = false
		offset = 1M
		size = 9M
		image = "opensbi/opensbi_rtt_system.bin"
		load = true
		boot = 0x3
	}

	partition rtapp {
		in-partition-table = false
		offset = 10M
		size = 30M
		image = "rtapp/rtapp.elf.gz"
		load = true
	}

	partition bin {
		in-partition-table = false
		flag = 0x400000008000040 # write_with_oob, page size 2048, oob size 64
		offset = 40M
		size = 20M
		erase-size = 20M
		image = "bin.uffs"
	}

	partition sdcard {
		in-partition-table = false
		flag = 0x400000008000040 # write_with_oob, page size 2048, oob size 64
		offset = 60M
		size = 60M
		erase-size = 60M
		image = "sdcard.uffs"
	}
}
