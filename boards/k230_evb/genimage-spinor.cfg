# W25Q256: 32 MiB. Keep this layout in sync with spinor_parts.h.
image bin.jffs2 {
	jffs2 {
		block-size = 65536
		page-size = 4096
	}
	size = 4M
	mountpoint = "bin"
}

image sdcard.jffs2 {
	jffs2 {
		block-size = 65536
		page-size = 4096
	}
	size = 12M
	mountpoint = "sdcard"
}

image sysimage-spinor.kdimg {
	size = 32M
	kdimage {
		image_info = "v1.1.0"
		chip_info = "K230"
		board_info = "K230_evb_spi_nor"
		medium-type = "spi_nor"
		spi-nor-erase-size = 64K
		raw-image = "sysimage-spinor.bin"
		toc = true
		toc-offset = 0xe0000
	}

	# Primary and backup SPL copies.
	partition spl_a {
		in-partition-table = false
		offset = 0
		size = 512K
		image = "uboot/swap_fn_u-boot-spl.bin"
	}

	# Leave the fixed TOC sector at 0xe0000 outside the backup SPL.
	partition spl_b {
		in-partition-table = false
		offset = 512K
		size = 384K
		image = "uboot/swap_fn_u-boot-spl.bin"
	}

	# Reserved metadata only; kernel and app each have one slot.
	partition ota_meta {
		in-partition-table = false
		offset = 0xf0000
		size = 64K
	}

	partition rtt {
		in-partition-table = false
		offset = 1M
		size = 5M
		image = "opensbi/opensbi_rtt_system.bin"
		load = true
		boot = 0x3
	}

	partition rtapp {
		in-partition-table = false
		offset = 6M
		size = 10M
		image = "rtapp/rtapp.elf.gz"
		load = true
	}

	partition bin {
		in-partition-table = false
		offset = 16M
		size = 4M
		image = "bin.jffs2"
	}

	partition sdcard {
		in-partition-table = false
		offset = 20M
		size = 12M
		image = "sdcard.jffs2"
	}
}
